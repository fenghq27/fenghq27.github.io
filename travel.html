<header class="heading"><svg class="section-art" viewBox="0 0 300 175" aria-hidden="true">
      <circle cx="211" cy="48" r="23" fill="#d5a378" opacity=".64"/>
      <path d="M25 126Q54 90 87 97L140 47L193 108Q228 88 265 129Z" fill="#8da899" opacity=".75"/>

    </svg><p class="eyebrow">01 / FIELD NOTES</p><h1>Places I’ve been</h1><p>Drag the globe or use the arrows to turn it. Pick a pin or a city to open its postcard.</p></header>
<section class="atlas" aria-label="Interactive travel map">
  <div class="atlas-top"><span>✳ POSTCARDS FROM ELSEWHERE</span><span id="place-count"></span></div>
  <div class="map-layout">
    <div class="map-frame">
      <div id="map" class="map globe">
        <canvas id="globe-surface" width="400" height="400" aria-label="World globe"></canvas>
      </div>
      <div class="globe-controls" aria-label="Rotate globe">
        <button class="paper-button" type="button" data-turn="-1" aria-label="Turn globe west">←</button>
        <button class="paper-button" type="button" data-turn="1" aria-label="Turn globe east">→</button>
      </div>
    </div>
    <aside id="preview" class="preview" aria-live="polite"></aside>
  </div>
  <div id="places" class="places" aria-label="Places on the map"></div>
</section>
<dialog id="place-dialog" aria-labelledby="place-title">
  <div class="dialog-paper"><form method="dialog"><button class="close" aria-label="Close postcard">×</button></form><div id="place-content"></div></div>
</dialog>
<noscript><p>Enable JavaScript to explore the collection.</p></noscript>
</main>
<footer><span>✿ SOPHIE’S WORLD</span><span>Little things worth keeping.</span></footer>
